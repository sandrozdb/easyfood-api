<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil | EasyFood</title><link rel="stylesheet" href="/account.css"><script src="/auth.js" defer></script><script src="/profile.js" defer></script></head><body class="profile-page"><main class="account"><nav><a href="/index.html">EasyFood</a><a href="/perfil.html">Meu perfil</a></nav><header class="profile-heading"><p class="eyebrow">Minha conta</p><h1>Meu perfil</h1><p>Gerencie seus dados e acesse as áreas disponíveis para sua conta.</p></header><section class="profile-card"><div class="profile-avatar"><img id="profile-image" src="/assets/dish-placeholder.svg" alt="Foto do perfil" width="160" height="160"></div><section id="profile" aria-label="Dados do usuário"></section></section><section class="profile-photo-card"><div><h2>Foto do perfil</h2><p>Use JPG, PNG ou WebP com até 5 MB.</p></div><label class="profile-file-label"><span>Escolher nova foto</span><input id="profile-file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="profile-photo-actions"><button id="profile-upload">Salvar nova foto</button><button id="profile-remove" hidden>Remover foto</button></div></section><section class="profile-shortcuts" aria-label="Atalhos da conta"><a id="dashboard" href="/dashboard.html" hidden><span>Visão do restaurante</span><strong>Dashboard</strong><b aria-hidden="true">→</b></a><a id="admin" href="/admin.html" hidden><span>Gestão do EasyFood</span><strong>Painel administrativo</strong><b aria-hidden="true">→</b></a></section><button id="logout" class="profile-logout">Sair da conta</button><p id="status" role="status" aria-live="polite"></p></main></body></html>
