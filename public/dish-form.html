<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prato | EasyFood</title><link rel="stylesheet" href="/account.css"><script src="/auth.js" defer></script><script src="/dish-form.js" defer></script></head>
<body><main class="account">
<nav><a href="/dashboard.html">← Dashboard</a><a href="/index.html">EasyFood</a></nav>
<h1 id="title">Adicionar prato</h1>
<form id="dish-form">
    <label>Restaurante <select id="restaurantId" required></select></label>
    <label>Nome <input id="name" maxlength="120" required></label>
    <label>Categoria <input id="category" maxlength="60" required></label>
    <label>Descrição <textarea id="description" maxlength="500"></textarea></label>
    <label>Preço (R$) <input id="price" type="number" min="0" max="99999999.99" step="0.01" required></label>
    <section id="current-image" hidden><h2>Imagem atual</h2><img id="current-image-preview" class="image-preview" alt="Imagem atual do prato"><button type="button" id="remove-image">Remover imagem</button></section>
    <label>Imagem do prato <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <p class="hint">JPEG, PNG ou WEBP, até 5 MB. A imagem anterior só é substituída após o novo upload terminar.</p>
    <img id="image-preview" class="image-preview" src="/assets/dish-placeholder.svg" alt="Preview da imagem do prato">
    <label><input id="available" type="checkbox" checked> Disponível</label>
    <button type="submit">Salvar prato</button>
</form>
<p id="status" role="status"></p>
</main></body>
</html>
